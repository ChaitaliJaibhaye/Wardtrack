<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>WardTrack – Quarantine Centre Prototype</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fa;--cd:#fff;--tx:#16202c;--mu:#667085;--bd:#e0e5ed;--pr:#0b6bcb;--ok:#117a4d;--okb:#dff4e8;--wa:#8a5200;--wab:#fff0d2;--er:#b42318;--erb:#fde3e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1520;--cd:#18202e;--tx:#e8edf5;--mu:#9aa6b8;--bd:#2a3446;--pr:#5aa8ff;--ok:#4cd39a;--okb:#14382b;--wa:#ffc766;--wab:#3b2c0e;--er:#ff8c82;--erb:#401a17}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1520;--cd:#18202e;--tx:#e8edf5;--mu:#9aa6b8;--bd:#2a3446;--pr:#5aa8ff;--ok:#4cd39a;--okb:#14382b;--wa:#ffc766;--wab:#3b2c0e;--er:#ff8c82;--erb:#401a17}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:980px;margin:0 auto;padding:14px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:19px;margin:0}h2{font-size:16px;margin:18px 0 8px}h3{margin:0 0 4px}
.mu{color:var(--mu);font-size:13px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st b{display:block;font-size:24px}
button{font:inherit;background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.g{background:transparent;color:var(--pr);border:1px solid var(--bd)}
button:disabled{opacity:.45;cursor:not-allowed}
button.rl{width:100%;text-align:left;background:var(--cd);color:var(--tx);border:1px solid var(--bd);padding:16px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{margin-left:auto}
.it{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}
.ch{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;background:var(--bd);color:var(--tx)}
.ch.ok{background:var(--okb);color:var(--ok)}.ch.wa{background:var(--wab);color:var(--wa)}.ch.er{background:var(--erb);color:var(--er)}
.al{border-radius:8px;padding:9px 12px;margin:8px 0;font-size:14px}.al.ok{background:var(--okb);color:var(--ok)}.al.wa{background:var(--wab);color:var(--wa)}.al.er{background:var(--erb);color:var(--er)}
input,select,textarea{width:100%;font:inherit;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mu)}
#m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
#m>div{background:var(--cd);border-radius:14px;padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#16202c;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:30;max-width:92%;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{background:var(--cd);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--pr);color:#fff}
.ov{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.hist{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}.hist span{font-size:12px;padding:3px 6px;border-radius:6px;background:var(--bd)}.hist .f{background:var(--erb);color:var(--er)}.hist .n{background:var(--okb);color:var(--ok)}
</style></head><body><div class="w" id="app"></div><div id="m"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),FEVER=38.0,CAP=74;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function seed(){let s=11;const r=()=>(s=s*16807%2147483647)/2147483647;
const F=['Aarav','Diya','Rohan','Meera','Kabir','Ananya','Vikram','Isha','Arjun','Neha','Sameer','Priya','Rahul','Kavya','Imran','Sana','Dev','Tara','Nikhil','Pooja','Farhan','Riya','Manav','Zoya','Yash'];
const L=['Patil','Sharma','Kulkarni','Khan','Desai','Iyer','Gupta','Joshi','Shaikh','Nair','Mehta','Reddy','Jadhav'];
const day=30,P=[];
for(let i=0;i<CAP;i++){const ago=1+Math.floor(r()*9),rec=ago>=4&&r()<.22,temps={};
for(let d=day-ago;d<day;d++){const nm=rec&&d>=day-3;if(!nm&&r()<.06)continue;temps[d]={t:+(nm?36.5+r()*.9:38.1+r()*1.5).toFixed(1),time:'08:'+(10+Math.floor(r()*40)),by:'Nurse Joshi'}}
const p={id:i+1,name:F[i%25]+' '+L[(i*7+3)%13],age:18+Math.floor(r()*60),room:i+1,admit:day-ago,status:'in',temps,visits:{},rec:false};
if(r()<.4){const t=rec?36.6+r()*.6:38+r()*1.6;p.temps[day]={t:+t.toFixed(1),time:'09:'+(10+Math.floor(r()*40)),by:'Nurse Joshi'};if(r()<.5)p.visits[day]={notes:'Reviewed, continue treatment.',tx:'Antipyretic + fluids',by:'Dr. Rao',time:'11:30'}}
P.push(p)}
return{day,P,cured:52,dead:9,nid:CAP+1}}
function load(){try{const v=localStorage.getItem('wt2');return v?JSON.parse(v):null}catch(e){return null}}
function save(){try{localStorage.setItem('wt2',JSON.stringify(S))}catch(e){}}
let S=load()||seed(),role=null,flt='all',tab='dash';
const act=()=>S.P.filter(p=>p.status==='in'),get=id=>S.P.find(p=>p.id===id);
const T=p=>p.temps[S.day],V=p=>p.visits[S.day],fv=t=>t>=FEVER,now=()=>new Date().toTimeString().slice(0,5);
const eligible=p=>{for(let d=S.day;d>S.day-3;d--){const x=p.temps[d];if(!x||fv(x.t))return false}return true};
const crit=p=>T(p)&&T(p).t>=39.5;
const who={nurse:'Nurse Joshi',doctor:'Dr. Rao',admin:'Admin Kulkarni'};
const chip=(t,c='')=>`<span class="ch ${c}">${t}</span>`;
function toast(m){const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
function modal(h){const m=$('#m');m.innerHTML='<div>'+h+'</div>';m.style.display='flex'}
function closeM(){$('#m').style.display='none'}
function mort(){const n=S.cured+S.dead;return n?S.dead/n*100:0}

function render(){const a=$('#app');
if(!role){a.innerHTML=`<div style="max-width:440px;margin:6vh auto"><h1>🏥 WardTrack</h1><p class="mu">Daily temperature, doctor-visit and discharge tracking for the quarantine &amp; treatment centre. Prototype v1 — pick a role to sign in.</p>
${[['nurse','Nurse','Record daily temperatures'],['doctor','Doctor','Review patients, add treatment notes, recommend discharge'],['admin','Admin staff','Occupancy, admissions, confirm discharges, mortality tracking']].map(r=>`<button class="rl" onclick="login('${r[0]}')"><b>${r[1]}</b><br><span class="mu">${r[2]}</span></button>`).join('')}
<p class="mu">Data is stored in your browser only (demo). <a href="#" onclick="resetAll();return false">Reset demo data</a></p></div>`;return}
a.innerHTML=`<header><div><h1>🏥 WardTrack</h1><span class="mu">${who[role]} · ${role[0].toUpperCase()+role.slice(1)} · Day ${S.day}</span></div><button class="g" onclick="logout()">Switch role</button></header>`+(role==='nurse'?nurse():role==='doctor'?doctor():admin())}
function login(r){role=r;flt='all';tab='dash';render()}
function logout(){role=null;closeM();render()}
function resetAll(){S=seed();save();toast('Demo data reset')}

function nurse(){const A=act(),pend=A.filter(p=>!T(p)).length;
const L=A.filter(p=>flt==='all'||(flt==='pend'?!T(p):!!T(p)));
return `<div class="g3"><div class="cd st"><span class="mu">Temps pending</span><b>${pend}</b></div><div class="cd st"><span class="mu">Done today</span><b>${A.length-pend}</b></div><div class="cd st"><span class="mu">Patients</span><b>${A.length}/${CAP}</b></div></div>
<h2>Today’s temperature round</h2><div class="tabs">${[['all','All'],['pend','Pending'],['done','Done']].map(f=>`<button class="${flt===f[0]?'on':''}" onclick="flt='${f[0]}';render()">${f[1]}</button>`).join('')}</div>
<div class="cd">${L.map(p=>`<div class="it"><div><b>Room ${p.room} · ${esc(p.name)}</b> <span class="mu">${p.age}y</span><br>${T(p)?chip(T(p).t.toFixed(1)+'°C at '+T(p).time,fv(T(p).t)?'er':'ok'):chip('Not measured','wa')}</div>
${T(p)?'<button disabled>Recorded</button>':`<button onclick="openTemp(${p.id})">Record temp</button>`}</div>`).join('')||'<p class="mu">Nothing here.</p>'}</div>`}

function openTemp(id){const p=get(id);if(T(p))return toast('Already recorded today at '+T(p).time+'. Duplicate readings are blocked.');
modal(`<h3>Record temperature</h3><p class="mu">Room ${p.room} · ${esc(p.name)}</p><label>Temperature (°C)</label><input id="tv" type="number" step="0.1" inputmode="decimal" oninput="chk(${id})" autofocus><div id="tw"></div><div class="row" style="margin-top:12px"><button class="g" onclick="closeM()">Cancel</button><button id="ts" class="sp" onclick="saveTemp(${id})" disabled>Save reading</button></div>`)}
function chk(id){const v=parseFloat($('#tv').value),w=$('#tw'),b=$('#ts'),p=get(id),y=p.temps[S.day-1];let h='';b.disabled=false;
if(isNaN(v)){b.disabled=true}
else if(v<34||v>42){b.disabled=true;h='<div class="al er">Value must be between 34.0 and 42.0 °C. Please re-check the thermometer.</div>'}
else{if(v>=39.5)h='<div class="al er">Critical fever. The doctor’s list will flag this patient as urgent.</div>';else if(fv(v))h='<div class="al wa">Fever (≥ 38.0 °C). The 3-day fever-free count stays at zero.</div>';else h='<div class="al ok">No fever.</div>';
if(y&&Math.abs(v-y.t)>=2)h+=`<div class="al wa">Differs by ${Math.abs(v-y.t).toFixed(1)} °C from yesterday (${y.t.toFixed(1)}). Please confirm before saving.</div>`}
w.innerHTML=h}
function saveTemp(id){const p=get(id),v=parseFloat($('#tv').value);if(T(p))return closeM();p.temps[S.day]={t:+v.toFixed(1),time:now(),by:who.nurse};save();closeM();toast('Saved '+v.toFixed(1)+' °C for '+p.name);render()}

function doctor(){const A=act().slice().sort((a,b)=>rk(a)-rk(b));
function rk(p){return crit(p)?0:(T(p)&&eligible(p)&&!V(p))?1:(T(p)&&!V(p))?2:!T(p)?3:4}
const rd=A.filter(p=>T(p)&&!V(p)).length;
return `<div class="g3"><div class="cd st"><span class="mu">Ready to visit</span><b>${rd}</b></div><div class="cd st"><span class="mu">Awaiting temp</span><b>${A.filter(p=>!T(p)).length}</b></div><div class="cd st"><span class="mu">Visited today</span><b>${A.filter(p=>V(p)).length}</b></div></div>
<h2>Patient rounds</h2><p class="mu">Patients without today’s temperature are locked, so you won’t visit before the nurse has measured.</p>
<div class="cd">${A.map(p=>`<div class="it"><div><b>Room ${p.room} · ${esc(p.name)}</b> <span class="mu">${p.age}y</span><br>
${T(p)?chip(T(p).t.toFixed(1)+'°C',fv(T(p).t)?'er':'ok'):chip('Awaiting temp','wa')} ${crit(p)?chip('Critical','er'):''} ${eligible(p)?chip('3 days fever-free','ok'):''} ${p.rec?chip('Discharge recommended','ok'):''} ${V(p)?chip('Visited '+V(p).time):''}</div>
<button ${T(p)?'':'disabled'} class="${V(p)?'g':''}" onclick="openVisit(${p.id})">${V(p)?'View / update':'Visit'}</button></div>`).join('')}</div>`}

function openVisit(id){const p=get(id),v=V(p),el=eligible(p);let hs='';for(let d=S.day-6;d<=S.day;d++){const x=p.temps[d];hs+=`<span class="${x?(fv(x.t)?'f':'n'):''}">D${d}: ${x?x.t.toFixed(1):'—'}</span>`}
modal(`<h3>Visit · ${esc(p.name)}</h3><p class="mu">Room ${p.room} · ${p.age}y · Today ${T(p).t.toFixed(1)} °C</p><div class="hist">${hs}</div>
${el?'<div class="al ok">3 consecutive fever-free days recorded. Discharge can be recommended.</div>':'<div class="al wa">Discharge not available: needs 3 consecutive days with recorded, fever-free temps.</div>'}
<label>Treatment</label><select id="tx">${['Antipyretic + fluids','Antiviral course','Oxygen support','Observation only','IV fluids + monitoring'].map(o=>`<option ${v&&v.tx===o?'selected':''}>${o}</option>`).join('')}</select>
<label>Clinical notes (required)</label><textarea id="nt" rows="3">${v?esc(v.notes):''}</textarea>
<label>Outcome today</label><select id="oc"><option value="c">Continue treatment</option><option value="d" ${el?'':'disabled'}>Recommend discharge</option><option value="x">Patient deceased</option></select><div id="vw"></div>
<div class="row" style="margin-top:12px"><button class="g" onclick="closeM()">Cancel</button><button class="sp" onclick="saveVisit(${id})">Save visit</button></div>`)}
function saveVisit(id){const p=get(id),n=$('#nt').value.trim(),oc=$('#oc').value,w=$('#vw');
if(n.length<5){w.innerHTML='<div class="al er">Please add clinical notes (at least 5 characters).</div>';return}
if(oc==='x'&&n.length<15){w.innerHTML='<div class="al er">Recording a death needs a fuller note (cause / time).</div>';return}
if(oc==='d'&&!eligible(p)){w.innerHTML='<div class="al er">Not eligible for discharge.</div>';return}
p.visits[S.day]={notes:n,tx:$('#tx').value,by:who.doctor,time:now()};
if(oc==='d')p.rec=true;
if(oc==='x'){p.status='dead';S.dead++}
save();closeM();toast(oc==='x'?'Death recorded. Bed released and mortality updated.':oc==='d'?'Discharge recommended. Admin notified.':'Visit saved');render()}

function admin(){const A=act(),m=mort(),q=A.filter(p=>p.rec),free=CAP-A.length;
const tabs=[['dash','Dashboard'],['dq','Discharges ('+q.length+')'],['adm','Admit'],['all','All patients']];
let b='';
if(tab==='dash')b=`${m>15?`<div class="al er"><b>Mortality above benchmark:</b> ${m.toFixed(1)}% vs 15% expected. Review treatment quality.</div>`:`<div class="al ok">Mortality ${m.toFixed(1)}% is within the 15% benchmark.</div>`}
${free===0?'<div class="al wa">Centre is at full occupancy (74/74). New admissions are blocked until a bed is freed.</div>':''}
<div class="g3"><div class="cd st"><span class="mu">Occupancy</span><b>${A.length}/${CAP}</b></div><div class="cd st"><span class="mu">Temps pending</span><b>${A.filter(p=>!T(p)).length}</b></div><div class="cd st"><span class="mu">Visits pending</span><b>${A.filter(p=>!V(p)).length}</b></div><div class="cd st"><span class="mu">Awaiting discharge</span><b>${q.length}</b></div><div class="cd st"><span class="mu">Cured / Deaths</span><b>${S.cured} / ${S.dead}</b></div><div class="cd st"><span class="mu">Success rate</span><b>${(100-m).toFixed(1)}%</b></div></div>
<h2>Demo control</h2><div class="cd"><p class="mu" style="margin-top:0">In real use the day rolls over automatically at midnight. Use this to show how the 3-day fever-free rule builds up.</p><button onclick="nextDay()">End Day ${S.day} → start Day ${S.day+1}</button></div>`;
if(tab==='dq')b=`<div class="cd">${q.map(p=>`<div class="it"><div><b>Room ${p.room} · ${esc(p.name)}</b><br><span class="mu">Recommended by ${esc((p.visits[S.day]||{by:'doctor'}).by)}</span></div><button onclick="dis(${p.id})">Confirm discharge</button></div>`).join('')||'<p class="mu">No discharges waiting.</p>'}</div>`;
if(tab==='adm')b=`<div class="cd"><h3>Admit new patient</h3>${free?`<p class="mu">Next free room: ${nextRoom()}</p><label>Full name</label><input id="an"><label>Age</label><input id="ag" type="number"><div id="aw"></div><button style="margin-top:12px" onclick="admit()">Admit patient</button>`:'<div class="al er">No beds available. Discharge a patient first.</div>'}</div>`;
if(tab==='all')b=`<div class="cd ov"><table><tr><th>Room</th><th>Name</th><th>Day of stay</th><th>Today’s temp</th><th>Visit</th><th>Status</th></tr>${A.map(p=>`<tr><td>${p.room}</td><td>${esc(p.name)}</td><td>${S.day-p.admit+1}</td><td>${T(p)?T(p).t.toFixed(1):'—'}</td><td>${V(p)?'Done':'—'}</td><td>${p.rec?chip('Discharge due','ok'):eligible(p)?chip('Eligible','ok'):chip('Treating')}</td></tr>`).join('')}</table></div>`;
return `<div class="tabs">${tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>`+b}
function nextRoom(){const u=new Set(act().map(p=>p.room));for(let r=1;r<=CAP;r++)if(!u.has(r))return r}
function dis(id){const p=get(id);p.status='out';p.rec=false;S.cured++;save();toast(p.name+' discharged. Room '+p.room+' is free.');render()}
function admit(){const n=$('#an').value.trim(),a=parseInt($('#ag').value),w=$('#aw');
if(act().length>=CAP){w.innerHTML='<div class="al er">No beds available.</div>';return}
if(n.length<2||isNaN(a)||a<0||a>120){w.innerHTML='<div class="al er">Enter a valid name and an age between 0 and 120.</div>';return}
const r=nextRoom();S.P.push({id:S.nid++,name:n,age:a,room:r,admit:S.day,status:'in',temps:{},visits:{},rec:false});save();toast(n+' admitted to room '+r);tab='dash';render()}
function nextDay(){const A=act(),mt=A.filter(p=>!T(p)).length,mv=A.filter(p=>!V(p)).length;S.day++;A.forEach(p=>p.rec=p.rec);save();toast('Day closed: '+mt+' temps and '+mv+' visits were missed. Day '+S.day+' started.');render()}
render();
</script></body></html>
